<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Michael Murombedzi — DevOps Terminal</title>
<meta name="description" content="Michael Murombedzi — DevOps, Cloud, Linux and Infrastructure Automation portfolio.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b10;--panel:#0b1118;--panel2:#0e1620;--fg:#e7f0f8;
  --muted:#8291a3;--accent:#64ffda;--cyan:#7df9ff;--green:#35e07f;
  --amber:#ffd166;--danger:#ff6b6b;--line:rgba(125,249,255,.14);
  --shadow:0 24px 80px rgba(0,0,0,.45);--radius:14px;
  --max:1180px
}
[data-theme="light"]{
  --bg:#f3f7fb;--panel:#fff;--panel2:#eef5f9;--fg:#0b1520;
  --muted:#5d6d7e;--accent:#0891b2;--cyan:#0284c7;--green:#16834b;
  --amber:#a16207;--danger:#dc2626;--line:rgba(2,132,199,.18);
  --shadow:0 24px 70px rgba(15,23,42,.14)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:
 radial-gradient(circle at 15% 10%,rgba(100,255,218,.07),transparent 28%),
 radial-gradient(circle at 85% 80%,rgba(125,249,255,.05),transparent 30%),
 var(--bg);color:var(--fg);font-family:"Fira Mono",ui-monospace,SFMono-Regular,Menlo,monospace
}
a{color:var(--cyan);text-decoration:none}
button,input{font:inherit}
.app{max-width:var(--max);margin:24px auto;padding:0 16px}
.terminal{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.titlebar{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.dot{width:11px;height:11px;border-radius:50%;margin-right:7px}.red{background:#ff5f56}.yellow{background:#ffbd2e}.green{background:#27c93f}
.title{margin-left:7px;color:var(--muted);font-weight:700}
.status{margin-left:auto;font-size:12px;color:var(--green)}
.layout{display:grid;grid-template-columns:210px 1fr;min-height:720px}
.sidebar{border-right:1px solid var(--line);padding:16px;background:rgba(0,0,0,.08)}
.side-label{font-size:11px;color:var(--muted);margin:8px 0}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--fg);padding:9px 8px;border-radius:7px;cursor:pointer}
.navbtn:hover,.navbtn.active{background:rgba(125,249,255,.08);color:var(--cyan)}
.screen{padding:22px;overflow:auto}
.boot{min-height:520px}
.line{white-space:pre-wrap;line-height:1.55}
.prompt{color:var(--cyan)}.accent{color:var(--accent)}.muted{color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--amber)}
.caret{display:inline-block;width:9px;height:1.05em;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 8px;font-size:14px}.card p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.6}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin:3px 4px 3px 0;color:var(--muted);font-size:11px}
.kpi{font-size:24px;color:var(--cyan);font-weight:700}.small{font-size:11px;color:var(--muted)}
.section-title{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px;margin:22px 0 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:transparent;color:var(--cyan);padding:8px 11px;border-radius:7px;cursor:pointer}
.btn:hover{background:rgba(125,249,255,.08)}
.hero{padding:8px 0 10px}
.hero h1{font-size:clamp(28px,5vw,56px);line-height:1.02;margin:10px 0}
.hero .role{font-size:clamp(14px,2vw,19px);color:var(--accent)}
.command{display:flex;gap:9px;align-items:center;border-top:1px solid var(--line);margin-top:22px;padding-top:15px}
.command input{flex:1;background:transparent;border:0;outline:0;color:var(--fg);min-width:0}
.project{position:relative}
.project .status-pill{position:absolute;right:14px;top:14px;font-size:10px;color:var(--green)}
.credential{display:grid;grid-template-columns:86px 1fr;gap:13px}
.thumb{width:86px;height:64px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,var(--panel),var(--panel2));display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cyan);font-size:10px;padding:7px}
.thumb.featured{height:100px}
.arch{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:center}
.node{padding:12px 7px;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:11px}
.arrow{text-align:center;color:var(--accent)}
.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted)}
.hidden{display:none!important}
.footer{border-top:1px solid var(--line);padding:11px 16px;color:var(--muted);font-size:11px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:5px;overflow:auto}.side-label{display:none}.navbtn{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}.arch{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.screen{padding:16px}.app{margin:8px auto}.terminal{border-radius:10px}}
</style>
</head>

const screen=document.getElementById("screen");
const input=document.getElementById("cmd");
const history=[]; let hidx=0;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function print(s,cls="line"){const d=document.createElement("div");d.className=cls;d.innerHTML=s;screen.appendChild(d);screen.scrollTop=screen.scrollHeight}
function section(t){print(`<div class="section-title">${esc(t)}</div>`)}
function badges(arr){return arr.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}

function dashboard(){
 screen.innerHTML="";
 print(`<div class="hero"><div class="small">mikey@devops:~$ system --profile</div><h1>${esc(DATA.name)}</h1><div class="role">${esc(DATA.title)}</div><p class="muted">Cloud infrastructure • DevOps • Linux • Automation • Security-minded engineering</p></div>`);

 print(`<div class="grid">
  <div class="card"><h3>Cloud</h3><div class="kpi">AWS / Azure</div><p>Cloud engineering and Infrastructure as Code focus.</p></div>
  <div class="card"><h3>DevOps</h3><div class="kpi">CI/CD</div><p>Terraform • Docker • Kubernetes • GitHub Actions • Jenkins</p></div>

 </div>`);

 DATA.projects.filter(p=>["phoenix","ts-capstone","cloud-resume"].includes(p.id)).forEach(p=>print(projectCard(p)));
 print(`<div class="actions"><button class="btn" onclick="run('projects')">./projects</button><button class="btn" onclick="run('certs')">./certs</button><button class="btn" onclick="run('architecture')">./architecture</button><button class="btn" onclick="run('contact')">./contact</button></div>`);

function projectCard(p){
 return `<div class="card project"><span class="status-pill">${esc(p.status)}</span><h3>${esc(p.name)}</h3><div>${badges(p.stack)}</div><p>${esc(p.summary)}</p><div class="actions"><button class="btn" onclick="run('project ${p.id}')">inspect</button>${p.repo?`<a class="btn" href="${p.repo}" target="_blank" rel="noopener">GitHub</a>`:""}</div></div>`;
}
function about(){
 screen.innerHTML=""; section("About");

function project(id){
 const p=DATA.projects.find(x=>x.id===id);
 screen.innerHTML=""; if(!p){print(`Project not found: ${esc(id)}`);return}
 section(p.name);
 print(`<div class="card"><div class="small">STATUS</div><div class="kpi">${esc(p.status)}</div><p>${esc(p.summary)}</p><div>${badges(p.stack)}</div></div>`);
 section("Case study");
 p.details.forEach(x=>print(`<div class="line">• ${esc(x)}</div>`));
 print(`<div class="actions">${p.repo?`<a class="btn" href="${p.repo}" target="_blank" rel="noopener">Open GitHub</a>`:""}<button class="btn" onclick="run('architecture')">View architecture</button></div>`);

function run(raw){
 const cmd=(raw||"").trim(); if(!cmd)return;
 history.push(cmd);hidx=history.length;
 if(cmd==="help")help();else if(cmd==="about")about();else if(cmd==="skills")skills();else if(cmd==="projects")projects();
 else if(cmd==="certs"||cmd==="certifications")certs();else if(cmd==="experience")experience();else if(cmd==="architecture")architecture();
 else if(cmd==="contact")contact();else if(cmd==="status")status();else if(cmd==="github")window.open(DATA.links.github,"_blank");
 else if(cmd==="credly")window.open(DATA.links.credly,"_blank");else if(cmd==="resume")window.open("Michael_Murombedzi_Updated_CV_2026.pdf","_blank");
 else if(cmd==="theme"){document.body.setAttribute("data-theme",document.body.dataset.theme==="light"?"dark":"light")}
 else if(cmd==="clear")screen.innerHTML="";
 else if(cmd==="sudo hire mikey"){screen.innerHTML="";print("Checking authorization...");setTimeout(()=>print("Technical foundation .... PASS<br>Cloud experience ........ PASS<br>DevOps projects ......... PASS<br>Security knowledge ...... PASS<br><br><span class='ok'>ACCESS GRANTED.</span>"),180)}
 else if(cmd.startsWith("project ")){project(cmd.slice(8).trim())}
 else {screen.innerHTML="";print(`Command not found: ${esc(cmd)}. Type <span class="accent">help</span>.`)}
}
window.run=run; window.dashboard=dashboard;
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>run(b.dataset.cmd)));
document.getElementById("cmd").addEventListener("keydown",e=>{
 if(e.key==="Enter"){run(input.value);input.value=""}
 if(e.key==="ArrowUp"){hidx=Math.max(0,hidx-1);input.value=history[hidx]||"";e.preventDefault()}
